services:
  llm-agent:
    build:
      context: ./llm_agent
      dockerfile: Dockerfile
      target: prod
    image: fastapi_rest:local_prod
    ports:
      - "8080:8080"
    env_file:
      - ./configuration/env_files/in-docker/local-production.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health/dummy-health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  movie-agent-worker:
    build:
      context: ./llm_agent
      dockerfile: Dockerfile
      target: prod
    image: movie-agent-worker:local_prod
    container_name: movie-agent-worker
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - ./configuration/env_files/in-docker/local-production.env
    environment:
      PORT: "8081"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_LOG_LEVEL: "info"
      UVICORN_RELOAD: "False"
      UVICORN_LOG_CONFIG_PATH: "/app/llm_agent/configuration/log_config_json.json"
      PICCOLO_CONF: "llm_agent.infrastructure.db.piccolo_conf"
      DI_REGISTRAR_PROVIDER: "llm_agent.di.app_registrar_providers.get_production_registrars"
      OTEL_SERVICE_NAME: "movie-agent-worker"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.environment=local,demo.name=multi-service-observability"
      MOVIE_RESERVATION_MCP_URL: "http://host.docker.internal:8091/mcp"
      AXUM_TOOLS_MCP_URL: "http://host.docker.internal:8092/mcp"
    labels:
      observability.logs: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/v1/demo/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
